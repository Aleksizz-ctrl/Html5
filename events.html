<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 5-7 - Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <span class="brand">Assignment 5</span>
        <div>
            <a href="index.html">Task 0-1</a>
            <a href="dom.html">Task 2-4</a>
            <a href="events.html" class="active">Task 5-7</a>
            <a href="todo.html">Task 8</a>
        </div>
    </nav>

    <div class="container">

        <div class="card">
            <h2>Task 5. Mouse Events</h2>
            <div class="box" id="hoverBox">Move your mouse over me</div>
        </div>

        <div class="card">
            <h2>Task 6. Keyboard Events</h2>
            <input type="text" id="typeInput" placeholder="Start typing...">
            <p>You typed: <span class="result" id="typeOutput"></span></p>
        </div>

        <div class="card">
            <h2>Task 7. Calculator</h2>
            <div class="row">
                <input type="number" id="num1" placeholder="Number 1">
                <select id="operator">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">×</option>
                    <option value="/">÷</option>
                </select>
                <input type="number" id="num2" placeholder="Number 2">
                <button id="calcBtn">=</button>
            </div>
            <div class="result" id="calcResult"></div>
        </div>

    </div>

    <script src="events.js"></script>
</body>
</html>
